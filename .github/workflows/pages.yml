# Publishes to GitHub Pages:
#   /          Institutional Profile booklet (profile/)
#   /website/  Frontend website mockup (mockup/)
# Publishes only from Shoaib. Pages source must be "GitHub Actions".
name: Deploy to Pages

on:
  push:
    branches: [Shoaib]
    paths:
      - "profile/**"
      - "mockup/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/Shoaib'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp -r profile/. _site/
          cp -r mockup _site/website
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
