<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help &amp; FAQs | Education Testing Council</title>
  <meta name="description" content="Answers to common questions about ETC registration, test day, results, fees, accessibility and institutional services.">
  <meta name="theme-color" content="#1F5E45">
  <link rel="icon" href="https://sbsi-cdn.sgp1.digitaloceanspaces.com/ETC/mockup/brand/etc-crest.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/site.css">
  <script defer src="assets/js/media.js"></script>
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/lib.js"></script>
  <script defer src="assets/js/partials.js"></script>
  <script defer src="assets/js/render.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>
<body data-page="faqs" class="bg-white font-sans text-ink">
  <div id="site-header"></div>

  <main id="main">
    <section class="relative overflow-hidden bg-green-900 text-white on-dark">
      <div class="absolute inset-0 pattern-dots" aria-hidden="true"></div>
      <div class="relative max-w-site mx-auto px-4 sm:px-6 lg:px-8 py-14 sm:py-20">
        <nav aria-label="Breadcrumb" class="text-sm text-white/70"><ol class="flex flex-wrap items-center gap-2"><li><a class="hover:text-white" href="index.html">Home</a></li><li aria-hidden="true">/</li><li><a class="hover:text-white" href="candidate-services.html">Candidate Services</a></li><li aria-hidden="true">/</li><li aria-current="page" class="text-white">Help &amp; FAQs</li></ol></nav>
        <p class="eyebrow mt-8">Help &amp; FAQs</p>
        <h1 class="mt-3 font-serif text-4xl sm:text-5xl font-semibold leading-tight">How can we help?</h1>
        <form role="search" class="mt-8 max-w-2xl" onsubmit="return false">
          <label for="faq-q" class="sr-only">Search questions</label>
          <div class="flex items-center gap-3 rounded-xl bg-white px-4 py-1.5 text-ink shadow-lift">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5 shrink-0 text-muted" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="faq-q" type="search" placeholder="Search, e.g. admit card, fee, results" class="w-full border-0 bg-transparent py-2.5 text-base focus:ring-0">
          </div>
        </form>
      </div>
    </section>

    <section class="max-w-site mx-auto px-4 sm:px-6 lg:px-8 py-12 grid gap-10 lg:grid-cols-12" aria-labelledby="faq-title">
      <h2 id="faq-title" class="sr-only">Frequently asked questions</h2>
      <div class="lg:col-span-3 min-w-0">
        <p class="text-xs font-semibold uppercase tracking-eyebrow text-gold-600" id="faq-cat-label">Topics</p>
        <div id="faq-cats" role="group" aria-labelledby="faq-cat-label" class="mt-3 flex gap-2 overflow-x-auto no-scrollbar lg:flex-col"></div>
      </div>
      <div class="lg:col-span-9 min-w-0">
        <p id="faq-count" class="text-sm text-muted" aria-live="polite"></p>
        <div id="faq-list" data-accordion class="mt-3 divide-y divide-line border-y border-line"></div>
        <div class="mt-10 flex flex-col gap-4 rounded-2xl bg-cream-50 p-6 ring-1 ring-gold-300/50 sm:flex-row sm:items-center sm:justify-between">
          <p><span class="font-semibold">Didn’t find your answer?</span> <span class="text-muted">Our helpline and email support can help.</span></p>
          <a href="contact.html" class="shrink-0 rounded-md bg-green-700 px-5 py-3 text-center font-semibold text-white hover:bg-green-800">Contact support</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    (window.ETC = window.ETC || {}).pageInits = (window.ETC.pageInits || []).concat(function () {
      var esc = ETC.render.esc, faqs = ETC.data.faqs;
      var cats = ["", "Registration", "Test day", "Results", "Fees", "Accessibility", "Institutions"];
      var catBox = document.getElementById("faq-cats"), list = document.getElementById("faq-list");
      var q = document.getElementById("faq-q"), count = document.getElementById("faq-count"), current = "";
      catBox.innerHTML = cats.map(function (c) {
        var n = c ? faqs.filter(function (f) { return f.category === c; }).length : faqs.length;
        return '<button type="button" data-cat="' + c + '" aria-pressed="' + (c === "") + '" class="flex shrink-0 items-center justify-between gap-3 whitespace-nowrap rounded-full lg:rounded-md px-4 py-2 text-sm font-medium ring-1 ring-line text-ink/80 hover:text-green-700 aria-pressed:bg-green-700 aria-pressed:text-white aria-pressed:ring-green-700">' +
          (c || "All topics") + '<span class="text-xs opacity-70">' + n + "</span></button>";
      }).join("");
      function draw() {
        var res = ETC.searchFaqs(faqs, q.value, current);
        count.textContent = res.length + (res.length === 1 ? " question" : " questions") + (q.value ? " matching “" + q.value + "”" : "");
        list.innerHTML = res.length ? res.map(function (f, i) {
          return '<div><h3><button type="button" aria-expanded="false" aria-controls="faq-a-' + i + '" id="faq-b-' + i + '" class="group flex w-full items-start justify-between gap-6 py-5 text-left font-semibold text-ink hover:text-green-700">' +
            '<span><span class="mb-1 block text-xs font-semibold uppercase tracking-wider text-gold-600">' + esc(f.category) + "</span>" + esc(f.q) + "</span>" +
            '<span class="mt-5 grid h-7 w-7 shrink-0 place-items-center rounded-full bg-mint-50 text-green-700 transition group-aria-expanded:rotate-45" aria-hidden="true">+</span></button></h3>' +
            '<div id="faq-a-' + i + '" role="region" aria-labelledby="faq-b-' + i + '" hidden class="pb-6 pr-12 text-ink/80 leading-relaxed">' + esc(f.a) + "</div></div>";
        }).join("") : '<div class="py-10 text-center"><p class="font-serif text-xl text-green-700">No questions match your search.</p><p class="mt-1 text-sm text-muted">Try another word, or <a class="font-semibold text-green-700 underline" href="contact.html">contact us</a>.</p></div>';
        ETC.enhance(list);
      }
      catBox.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-cat]");
        if (!b) return;
        current = b.getAttribute("data-cat");
        ETC.$$("button", catBox).forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        draw();
      });
      var t; q.addEventListener("input", function () { clearTimeout(t); t = setTimeout(draw, 150); });
      draw();
    });
  </script>
</body>
</html>
